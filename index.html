<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0c0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="A minimal gongfu style tea brewing timer.">
<title>Gongfu Timer</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='42' fill='none' stroke='%23d4a24a' stroke-width='8'/></svg>">
</head>
<body>
<main class="app">

  <header class="head">
    <p class="steep" id="steepLabel">Steep 1</p>
    <p class="hint" id="hintLabel">Choose a steeping time</p>
  </header>

  <button class="sound" id="soundBtn" type="button" aria-pressed="true" aria-label="Sound on" title="Sound (s)">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path class="spk" d="M4 9.4h3.4L12 5.2v13.6L7.4 14.6H4z"/>
      <g class="on-marks">
        <path d="M15.4 9.4a3.6 3.6 0 0 1 0 5.2"/>
        <path d="M18.1 7a7.2 7.2 0 0 1 0 10"/>
      </g>
      <g class="off-marks">
        <path d="M15.8 9.9l4.6 4.2"/>
        <path d="M20.4 9.9l-4.6 4.2"/>
      </g>
    </svg>
  </button>

  <section class="dial-wrap">
    <button class="dial-btn" id="dialBtn" type="button" aria-label="Start, pause or resume the timer">
      <svg class="dial" viewBox="0 0 200 200" aria-hidden="true">
        <defs>
          <clipPath id="dialClip"><circle cx="100" cy="100" r="92"/></clipPath>
          <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="#d0a054" stop-opacity=".80"/>
            <stop offset="100%" stop-color="#6c4a19" stop-opacity=".70"/>
          </linearGradient>
        </defs>

        <circle class="dial-face" cx="100" cy="100" r="92"/>

        <g clip-path="url(#dialClip)">
          <g id="waterLevel" class="water-level">
            <g class="wave wave-back"><path id="waveBack"/></g>
            <g class="wave wave-front"><path id="waveFront"/></g>
          </g>
        </g>

        <circle class="ring-track" cx="100" cy="100" r="92"/>
        <circle class="ring-progress" id="ringProgress" cx="100" cy="100" r="92"/>
      </svg>

      <div class="readout">
        <span class="time" id="timeLabel">0:00</span>
        <span class="state" id="stateLabel"></span>
      </div>
    </button>
  </section>

  <section class="controls">

    <div class="field" id="nextField" hidden>
      <span class="field-label">Next infusion</span>
      <div class="stepper">
        <button class="step" id="nextMinus" type="button" aria-label="Shorten next infusion by 5 seconds">&minus;5s</button>
        <span class="step-value" id="nextValue" aria-live="polite">+5s</span>
        <button class="step" id="nextPlus" type="button" aria-label="Lengthen next infusion by 5 seconds">+5s</button>
      </div>
    </div>

    <div class="field" id="initialField">
      <label class="field-label" for="initialSelect">Initial steep</label>
      <select class="select" id="initialSelect"></select>
    </div>

    <div class="field" id="incrementField">
      <span class="field-label">Increment per steep</span>
      <div class="stepper">
        <button class="step" id="incMinus" type="button" aria-label="Decrease increment by 5 seconds">&minus;5s</button>
        <span class="step-value" id="incValue" aria-live="polite">+5s</span>
        <button class="step" id="incPlus" type="button" aria-label="Increase increment by 5 seconds">+5s</button>
      </div>
    </div>

    <div class="log-row">
      <div class="log" id="log" aria-live="polite"></div>
      <button class="reset" id="resetBtn" type="button" hidden>Reset</button>
    </div>
  </section>

</main>
<script src="app.js"></script>
</body>
</html>
